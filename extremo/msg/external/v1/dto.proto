syntax = "proto3";

// Package extremo.msg.external.v1 holds the PUBLIC data-transfer objects of the
// Extremo external partner API. These are hand-built for external consumers and
// intentionally expose only safe, stable fields. Internal database shapes
// (primary keys exposed as opaque ids, foreign keys, soft-delete flags,
// audit timestamps, nested internal relations) are NOT represented here.
package extremo.msg.external.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/threecorp/extremo-external-proto/externalgo/extremo/msg/external/v1;external";

// BookingStatus is the public lifecycle state of a booking.
enum BookingStatus {
  // Unspecified / unknown status.
  BOOKING_STATUS_UNSPECIFIED = 0;
  // The booking was canceled.
  BOOKING_STATUS_CANCELED = 1;
  // Draft — not yet confirmed.
  BOOKING_STATUS_DRAFT = 2;
  // Reserved / confirmed.
  BOOKING_STATUS_RESERVED = 3;
  // Ordered (checked out / fulfilled).
  BOOKING_STATUS_ORDERED = 4;
  // The consumer did not show up.
  BOOKING_STATUS_NO_SHOW = 5;
}

// SlotStatus is the availability state of a calendar slot.
enum SlotStatus {
  // Unspecified / unknown status.
  SLOT_STATUS_UNSPECIFIED = 0;
  // The slot is bookable.
  SLOT_STATUS_AVAILABLE = 1;
  // The slot is partially taken (some capacity used).
  SLOT_STATUS_BUSY = 2;
  // The slot is fully booked.
  SLOT_STATUS_FULL = 3;
}

// Service is a public service / menu offering of a tenant.
message Service {
  // Opaque public identifier of the service.
  uint64 id = 1;
  // Display name.
  string name = 2;
  // Description.
  string desc = 3;
  // This service's own duration in seconds (3600 for a one-hour service),
  // children excluded. See total_duration for what a booking reserves.
  int32 duration = 4;
  // This service's own price in the tenant's minor currency unit (e.g. JPY),
  // children excluded. See total_price for what a booking charges.
  int64 price = 5;
  // Display order (ascending).
  int32 sort = 6;
  // Child services for hierarchical menus.
  repeated Service children = 7;
  // Public image URLs.
  repeated string image_urls = 8;
  // Duration in seconds including all child services. Booking this service
  // reserves start_at .. start_at + total_duration.
  int32 total_duration = 9;
  // Price including all child services, in the same unit as price. Booking
  // this service records this price.
  int64 total_price = 10;
}

// TenantProfile is the public profile of a tenant (shop).
message TenantProfile {
  // Opaque public identifier of the tenant.
  uint64 id = 1;
  // Shop name.
  string name = 2;
  // Description.
  string desc = 3;
  // Public link (website / booking page).
  string link = 4;
  // Public contact phone.
  string phone = 5;
  // Public image URLs.
  repeated string image_urls = 6;
  // Shop address shown to consumers coming to the shop.
  TenantAddress address = 7;
  // Booking rules a calendar needs before it asks for availability.
  TenantBookingSetting booking_setting = 8;
}

// TenantAddress is the public address of a tenant (shop).
message TenantAddress {
  // ZIP / postal code.
  string zip = 1;
  // Prefecture, city and street name.
  string address1 = 2;
  // Street number.
  string address2 = 3;
  // Building name.
  string building = 4;
  // Floor and room number.
  string floor = 5;
  // Nearby landmark (station, bus stop).
  string nearby = 6;
}

// TenantBookingSetting is the part of a tenant's settings that shapes its booking
// calendar. Hours are wall-clock hours in `time_zone`; a value of 24 or more is
// an hour of the next day (26 = 02:00 the next day). Which scheduling strategy
// applies is reported by AvailabilityService.ListSlots as `schedule_type`.
message TenantBookingSetting {
  // First bookable hour of a day (5..28).
  int32 calendar_start = 1;
  // Hour the shop closes (6..29); a booking may end exactly at this hour.
  int32 calendar_end = 2;
  // Slot width in seconds (1800 = 30 minutes).
  int32 calendar_interval = 3;
  // Bookings a single slot can hold when the strategy counts slots.
  int32 calendar_slot = 4;
  // When true, CreateBooking returns RESERVED; otherwise DRAFT until the shop
  // accepts it.
  bool auto_accept_booking = 5;
  // Notes the shop asks consumers to read before booking.
  string reservation_note = 6;
  // IANA time zone the hours are in. Always "Asia/Tokyo" today.
  string time_zone = 7;
}

// BookingConflictReason is why a booking write was rejected by the availability
// check. CreateBooking and UpdateBooking return it as the `reason` of a
// google.rpc.ErrorInfo detail (domain "extremo.api.external") on an
// INVALID_ARGUMENT status. The value names are a contract: they are never renamed
// or reused. Treat an unknown reason as a generic rejection.
enum BookingConflictReason {
  // Unspecified / unknown reason.
  BOOKING_CONFLICT_REASON_UNSPECIFIED = 0;
  // No staff member is on shift for the requested time.
  BOOKING_CONFLICT_REASON_NO_STAFF_ON_DUTY = 1;
  // The requested staff member is not on shift for the requested time.
  BOOKING_CONFLICT_REASON_STAFF_NOT_ATTENDING = 2;
  // The requested staff member already serves another booking at that time.
  BOOKING_CONFLICT_REASON_STAFF_BOOKED = 3;
  // Every seat or staff member is taken for the requested time.
  BOOKING_CONFLICT_REASON_CAPACITY_FULL = 4;
  // The requested time has passed or starts too soon to book.
  BOOKING_CONFLICT_REASON_TOO_SOON = 5;
  // The requested time is outside the shop's business hours.
  BOOKING_CONFLICT_REASON_OUTSIDE_BUSINESS_HOURS = 6;
}

// Staff is the minimal public representation of a staff member.
message Staff {
  // Opaque public identifier of the staff member.
  uint64 id = 1;
  // Display name.
  string name = 2;
}

// Booking is a public booking / reservation.
message Booking {
  // Opaque public identifier of the booking.
  uint64 id = 1;
  // Title.
  string name = 2;
  // Description.
  string desc = 3;
  // Lifecycle status.
  BookingStatus status = 4;
  // Start time (UTC).
  google.protobuf.Timestamp start_at = 5;
  // End time (UTC). Derived from the booked services' total duration.
  google.protobuf.Timestamp end_at = 6;
  // Opaque ids of the services booked (see Service.id). May be empty for
  // bookings that predate service linkage.
  repeated uint64 service_ids = 7;
  // Last modification time (UTC). Echo this back as UpdateBookingRequest
  // .expected_updated_at for optimistic concurrency control.
  google.protobuf.Timestamp updated_at = 8;
  // Opaque ids of the consumers on the booking (see Consumer.id). A booking made
  // through CreateBooking has one; a booking made in the store may have several.
  repeated uint64 consumer_ids = 9;
  // The partner's own id for this booking, if one was set (any string, unique per
  // tenant among bookings).
  string external_id = 10;
  // Partner key-value pairs set on this booking (Stripe-style metadata).
  map<string, string> metadata = 11;
}

// Consumer is a tenant's consumer (a CONSUMER record) as managed over the external
// partner API. `id` is the opaque Extremo handle (tenant-scoped) — use it in future
// booking calls; `external_id` is the partner's own id for the consumer, if one was
// set. Contact fields echo what the partner registered.
message Consumer {
  // Opaque Extremo identifier of the consumer (tenant-scoped).
  uint64 id = 1;
  // Display name.
  string name = 2;
  // Email, if the consumer was registered with one.
  string email = 3;
  // Phone, if the consumer was registered with one.
  string phone = 4;
  // The partner's own id for this consumer, if one was set (any string, unique per
  // tenant among consumers).
  string external_id = 5;
  // Registration time (UTC).
  google.protobuf.Timestamp created_at = 6;
  // Partner key-value pairs set on this consumer (Stripe-style metadata).
  map<string, string> metadata = 7;
}

// AvailabilitySlot is a single bookable time window with its resolved status.
message AvailabilitySlot {
  // Start time (UTC). The start_at to pass to CreateBooking.
  google.protobuf.Timestamp start_at = 1;
  // End of this calendar cell (UTC): start_at + the tenant's calendar interval.
  // It is not when a booking would end; a booking starting at start_at ends at
  // start_at + the sum of the chosen services' Service.total_duration.
  google.protobuf.Timestamp end_at = 2;
  // Availability status of this slot.
  SlotStatus status = 3;
}

// BookingEventType is the public kind of a booking change in the event feed.
// Internal mutation kinds are folded into this stable public vocabulary (e.g.
// reject/delete both surface as CANCELED).
enum BookingEventType {
  // Unspecified / unknown event type.
  BOOKING_EVENT_TYPE_UNSPECIFIED = 0;
  // A booking was created.
  BOOKING_EVENT_TYPE_CREATED = 1;
  // A booking's attributes changed.
  BOOKING_EVENT_TYPE_UPDATED = 2;
  // A booking was confirmed (accepted by the tenant).
  BOOKING_EVENT_TYPE_CONFIRMED = 3;
  // A booking was canceled (canceled, rejected, or deleted).
  BOOKING_EVENT_TYPE_CANCELED = 4;
  // The consumer did not show up.
  BOOKING_EVENT_TYPE_NO_SHOW = 5;
}

// BookingEvent is one entry in a tenant's booking change feed: an append-only,
// cursor-paginated stream of booking lifecycle changes. An external consumer
// polls "what changed since my last cursor", and the same feed backs webhook
// delivery. Internal audit detail (actor identity, raw field diffs) is not
// exposed.
message BookingEvent {
  // Opaque cursor for this event. Pass the response's next_cursor back as the
  // request cursor to fetch events after this one.
  string cursor = 1;
  // What kind of change this event represents.
  BookingEventType type = 2;
  // Opaque public identifier of the booking this event is about. It stays set
  // after the shop hard-deletes the booking, so every event of a deleted booking
  // still names it.
  uint64 booking_id = 3;
  // When the change occurred (UTC).
  google.protobuf.Timestamp occurred_at = 4;
  // Snapshot of the booking after the change. Absent if the booking has since
  // been hard-deleted (the event type still records what happened).
  Booking booking = 5;
}
