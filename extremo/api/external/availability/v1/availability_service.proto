syntax = "proto3";

// Package extremo.api.external.availability.v1 is part of the Extremo external
// partner API. Unlike the internal `public/` services (which are anonymous and
// read-only for the booking page), the `external/` surface is authenticated via
// OAuth2 consumer_credentials / API key and scoped. It returns public DTOs only.
package extremo.api.external.availability.v1;

import "buf/validate/validate.proto";
import "extremo/msg/external/v1/dto.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/threecorp/extremo-external-proto/externalgo/extremo/api/external/availability/v1;availability";

// AvailabilityService exposes a tenant's calendar slot availability to
// authenticated external API consumers. Read-only.
service AvailabilityService {
  // ListSlots returns per-slot availability (AVAILABLE / BUSY / FULL) for a
  // tenant's service, or several services booked together, over a date range.
  rpc ListSlots(ListSlotsRequest) returns (ListSlotsResponse) {
    option (google.api.http) = {get: "/api/external/v1/{tenant_id}/availability"};
  }
}

// ListSlotsRequest selects a tenant + services + date range to compute availability for.
message ListSlotsRequest {
  option (buf.validate.message).cel = {
    id: "service_selection"
    message: "specify exactly one of service_id or service_ids"
    expression: "(this.service_id > 0u) != (size(this.service_ids) > 0)"
  };

  // Tenant whose availability to compute.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // A single service whose total duration (children included) drives slot
  // feasibility. Set this or service_ids, not both.
  uint64 service_id = 2;
  // Start of the date range to compute (inclusive).
  google.protobuf.Timestamp opened_at = 3 [(buf.validate.field).required = true];
  // End of the date range to compute (exclusive).
  google.protobuf.Timestamp closed_at = 4 [(buf.validate.field).required = true];
  // Services booked together (the service_ids CreateBooking will receive). A
  // slot is available when the sum of their total durations fits from its
  // start, as CreateBooking checks. Set this or service_id, not both.
  repeated uint64 service_ids = 5 [(buf.validate.field).repeated = {
    unique: true
    items: {
      uint64: {gt: 0}
    }
  }];
  // Optional consumer the booking is for (Consumer.id). When set, slots that
  // would overlap one of this consumer's own live bookings are FULL, because
  // CreateBooking / UpdateBooking reject a consumer's double booking. A consumer
  // that cannot book (pending or deactivated) is INVALID_ARGUMENT.
  uint64 consumer_id = 6;
  // Optional booking being rescheduled (Booking.id). When set, that booking is
  // not counted, as UpdateBooking does not count it against itself, and the slots
  // are checked for the staff and consumers it keeps, as UpdateBooking checks them.
  uint64 exclude_booking_id = 7;
}

// ListSlotsResponse is the computed availability grid for the requested range.
message ListSlotsResponse {
  // Per-slot availability over the requested range.
  repeated extremo.msg.external.v1.AvailabilitySlot slots = 1;
  // Scheduling strategy used to compute the grid: "coop", "slot", or "hybrid".
  string schedule_type = 2;
}
