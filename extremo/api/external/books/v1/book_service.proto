syntax = "proto3";

// Package extremo.api.external.books.v1 is part of the Extremo external partner
// API. Unlike the anonymous internal `public/` booking-page services, the
// `external/` surface is authenticated via a per-tenant API key and scoped.
// Bookings are consumer-PII-adjacent, so the reads require the `book.read`
// scope (stricter than the public-grade services/tenants/availability reads) and
// return the public Booking DTO only — no consumer identity, staff, internal
// foreign keys, or pricing. The writes require `book.create` (CreateBooking),
// `book.update` (UpdateBooking / CancelBooking) or `book.moderate` (AcceptBooking /
// RejectBooking / NoShowBooking); a created booking is validated by the same
// availability rules as an in-store booking (schedule capacity, staff coverage,
// business hours, 30 minutes' notice), returning InvalidArgument when the slot
// cannot be taken.
package extremo.api.external.books.v1;

import "buf/validate/validate.proto";
import "extremo/msg/external/v1/dto.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/threecorp/extremo-external-proto/externalgo/extremo/api/external/books/v1;books";

// BookService exposes a tenant's bookings to authenticated external API
// consumers: reads (book.read) plus create / update / cancel (book.create,
// book.update) and the shop's decisions (book.moderate). The status changes
// behave as in the admin UI.
service BookService {
  // ListBookings returns a tenant's bookings overlapping [start_at, end_at),
  // newest first, paginated: a booking crossing either edge of the window is
  // included, one that only touches it is not (a zero-length booking at
  // start_at is included). A window with end_at not after start_at lists
  // nothing. Requires book.read.
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse) {
    option (google.api.http) = {get: "/api/external/v1/{tenant_id}/books"};
  }
  // GetBooking returns a single booking by its opaque id, scoped to the tenant.
  // Requires book.read.
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse) {
    option (google.api.http) = {get: "/api/external/v1/{tenant_id}/books/{id}"};
  }
  // CreateBooking books a service for a registered consumer (consumer_id),
  // validates the slot against the tenant's schedule (capacity / staff / no past
  // times), sends the same notifications as an in-store booking, and returns the
  // new booking (DRAFT, or RESERVED when the tenant auto-accepts).
  // A slot the schedule cannot take returns INVALID_ARGUMENT with a
  // google.rpc.ErrorInfo detail (domain "extremo.api.external") whose reason is a
  // BookingConflictReason name: outside business hours, starting within 30
  // minutes, or no free staff / seat. When two bookings race for the same free
  // time, one may return ABORTED; retry it with the same idempotency_key.
  // Requires book.create. Supply idempotency_key to make retries safe: resending
  // the same key replays the original booking instead of creating a duplicate.
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse) {
    option (google.api.http) = {
      post: "/api/external/v1/{tenant_id}/books"
      body: "*"
    };
  }
  // UpdateBooking changes a booking's time / services / name / desc, and its
  // external_id / metadata. Requires book.update. Pass expected_updated_at (from
  // Booking.updated_at) for optimistic concurrency; a mismatch returns ABORTED.
  // Changing only external_id / metadata leaves the booking itself untouched.
  // A new time or service set the schedule cannot take is rejected the same way
  // as CreateBooking (INVALID_ARGUMENT + google.rpc.ErrorInfo); a new start needs
  // the same 30 minutes' notice (BOOKING_CONFLICT_REASON_TOO_SOON). A booking that
  // starts within 30 minutes keeps its time and services: changing them returns
  // INVALID_ARGUMENT without ErrorInfo. Without expected_updated_at, a change
  // committed after this call read the booking returns ABORTED too.
  rpc UpdateBooking(UpdateBookingRequest) returns (UpdateBookingResponse) {
    option (google.api.http) = {
      patch: "/api/external/v1/{tenant_id}/books/{id}"
      body: "*"
    };
  }
  // CancelBooking cancels a booking (DRAFT / RESERVED / ORDERED -> CANCELED).
  // Requires book.update. There is no hard-delete on the external surface.
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse) {
    option (google.api.http) = {
      post: "/api/external/v1/{tenant_id}/books/{id}:cancel"
      body: "*"
    };
  }
  // AcceptBooking confirms a DRAFT booking (DRAFT -> RESERVED), as the admin UI
  // does. Requires book.moderate.
  rpc AcceptBooking(AcceptBookingRequest) returns (AcceptBookingResponse) {
    option (google.api.http) = {
      post: "/api/external/v1/{tenant_id}/books/{id}:accept"
      body: "*"
    };
  }
  // RejectBooking declines a DRAFT booking (DRAFT -> CANCELED) of a tenant that
  // does not auto-accept, as the admin UI does. Requires book.moderate.
  rpc RejectBooking(RejectBookingRequest) returns (RejectBookingResponse) {
    option (google.api.http) = {
      post: "/api/external/v1/{tenant_id}/books/{id}:reject"
      body: "*"
    };
  }
  // NoShowBooking records that the consumer did not show up (RESERVED ->
  // NO_SHOW), as the admin UI does. Requires book.moderate.
  rpc NoShowBooking(NoShowBookingRequest) returns (NoShowBookingResponse) {
    option (google.api.http) = {
      post: "/api/external/v1/{tenant_id}/books/{id}:noShow"
      body: "*"
    };
  }
}

// ListBookingsRequest selects a tenant's bookings within a bounded time window.
// The window is required so the query is never unbounded.
message ListBookingsRequest {
  // Tenant whose bookings to list (must match the API key's tenant).
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Start of the time window (inclusive).
  google.protobuf.Timestamp start_at = 2 [(buf.validate.field).required = true];
  // End of the time window (exclusive).
  google.protobuf.Timestamp end_at = 3 [(buf.validate.field).required = true];
  // 1-based page number.
  int64 page = 4 [(buf.validate.field).int64.gt = 0];
  // Page size (1..100).
  int64 page_size = 5 [(buf.validate.field).int64 = {
    gt: 0
    lte: 100
  }];
  // When true, return only bookings created through the external partner API or
  // tagged with an external_id / metadata through it; other bookings are excluded.
  bool only_external = 6;
  // When set, return only the booking whose external_id equals this value.
  string external_id = 7 [(buf.validate.field).string.max_len = 255];
  // When set, return only bookings that include this consumer (see Consumer.id).
  uint64 consumer_id = 8;
}

// ListBookingsResponse is a page of public bookings.
message ListBookingsResponse {
  // The bookings on this page.
  repeated extremo.msg.external.v1.Booking bookings = 1;
  // Total number of bookings across all pages within the window.
  int64 total_size = 2 [(buf.validate.field).int64.gte = 0];
}

// GetBookingRequest selects a single booking under a tenant.
message GetBookingRequest {
  // Tenant the booking belongs to (must match the API key's tenant).
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Opaque public identifier of the booking.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
}

// GetBookingResponse carries the requested public booking.
message GetBookingResponse {
  // The booking.
  extremo.msg.external.v1.Booking booking = 1;
}

// CreateBookingRequest books one or more services for a consumer at a start
// time. The end time is derived server-side from the services' total duration,
// so no end time is accepted.
//
// The consumer must already exist: register one through ConsumerService, keep
// the returned Consumer.id, and pass it here. Booking never creates a consumer
// as a side effect. A partner holding its own id instead of ours can translate
// it with ConsumerService.ListConsumers (external_id filter).
message CreateBookingRequest {
  // Tenant to book under (must match the API key's tenant).
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Services to book (>= 1). Opaque service ids (see Service.id).
  repeated uint64 service_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      uint64: {gt: 0}
    }
  }];
  // Requested start time (required).
  google.protobuf.Timestamp start_at = 3 [(buf.validate.field).required = true];
  // Optional booking title.
  string name = 5 [(buf.validate.field).string.max_len = 255];
  // Optional booking note.
  string desc = 6 [(buf.validate.field).string.max_len = 1024];
  // Optional idempotency key (<= 255). Resending the same key for this tenant
  // replays the original booking instead of creating a duplicate.
  string idempotency_key = 7 [(buf.validate.field).string.max_len = 255];
  // Optional partner's own id for the booking (any string, unique per tenant).
  string external_id = 8 [(buf.validate.field).string.max_len = 255];
  // The consumer to book for (Consumer.id from ConsumerService).
  uint64 consumer_id = 9 [(buf.validate.field).uint64.gt = 0];
  // Optional partner key-value pairs (up to 50 keys; key 1-40 chars without
  // square brackets; value up to 500 chars).
  map<string, string> metadata = 10 [(buf.validate.field).map = {
    max_pairs: 50
    keys: {
      string: {
        min_len: 1
        max_len: 40
        pattern: "^[^\\[\\]]+$"
      }
    }
    values: {
      string: {max_len: 500}
    }
  }];

  // 4 held `Consumer consumer`, an inline contact the API resolved-or-created a
  // consumer from. Removed in favour of consumer_id: a booking write no longer
  // provisions a consumer as a side effect.
  reserved 4;
  reserved "consumer";
}

// CreateBookingResponse carries the created booking.
message CreateBookingResponse {
  // The created booking (DRAFT, or RESERVED when the tenant auto-accepts).
  extremo.msg.external.v1.Booking booking = 1;
}

// UpdateBookingRequest changes a booking. Only the set fields are applied;
// changing service_ids or start_at re-derives the end time. metadata merges into
// the stored pairs: a key with an empty value is removed, and the merged result
// may hold at most 50 keys.
message UpdateBookingRequest {
  // Tenant the booking belongs to.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Booking to update.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
  // Optional new start time.
  google.protobuf.Timestamp start_at = 3;
  // Optional new service set (opaque service ids).
  repeated uint64 service_ids = 4;
  // New title (empty = unchanged).
  string name = 5 [(buf.validate.field).string.max_len = 255];
  // New note (empty = unchanged).
  string desc = 6 [(buf.validate.field).string.max_len = 1024];
  // New partner's own id (empty = unchanged).
  string external_id = 7 [(buf.validate.field).string.max_len = 255];
  // Optimistic-lock guard. When set, the update is rejected with ABORTED if the
  // booking's current updated_at differs (echo Booking.updated_at here).
  google.protobuf.Timestamp expected_updated_at = 8;
  // Key-value pairs to merge into the stored metadata (empty value = remove key).
  // Up to 100 entries per request, so removals and additions fit in one call; the
  // merged result may hold at most 50 keys.
  map<string, string> metadata = 9 [(buf.validate.field).map = {
    max_pairs: 100
    keys: {
      string: {
        min_len: 1
        max_len: 40
        pattern: "^[^\\[\\]]+$"
      }
    }
    values: {
      string: {max_len: 500}
    }
  }];
}

// UpdateBookingResponse carries the updated booking.
message UpdateBookingResponse {
  // The updated booking.
  extremo.msg.external.v1.Booking booking = 1;
}

// CancelBookingRequest cancels a booking.
message CancelBookingRequest {
  // Tenant the booking belongs to.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Booking to cancel.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
  // Optional free-text cancellation reason (<= 512).
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

// CancelBookingResponse carries the canceled booking.
message CancelBookingResponse {
  // The canceled booking (status CANCELED).
  extremo.msg.external.v1.Booking booking = 1;
}

// AcceptBookingRequest confirms a DRAFT booking.
message AcceptBookingRequest {
  // Tenant the booking belongs to.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Booking to accept.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
}

// AcceptBookingResponse carries the accepted booking.
message AcceptBookingResponse {
  // The accepted booking (status RESERVED).
  extremo.msg.external.v1.Booking booking = 1;
}

// RejectBookingRequest declines a DRAFT booking.
message RejectBookingRequest {
  // Tenant the booking belongs to.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Booking to reject.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
  // Optional free-text rejection reason (<= 512).
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

// RejectBookingResponse carries the rejected booking.
message RejectBookingResponse {
  // The rejected booking (status CANCELED).
  extremo.msg.external.v1.Booking booking = 1;
}

// NoShowBookingRequest records that the consumer did not show up.
message NoShowBookingRequest {
  // Tenant the booking belongs to.
  uint64 tenant_id = 1 [(buf.validate.field).uint64.gt = 0];
  // Booking to mark as a no-show.
  uint64 id = 2 [(buf.validate.field).uint64.gt = 0];
  // Optional free-text reason (<= 512).
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

// NoShowBookingResponse carries the updated booking.
message NoShowBookingResponse {
  // The booking (status NO_SHOW).
  extremo.msg.external.v1.Booking booking = 1;
}
