version: v2
# Standalone module for the Extremo EXTERNAL partner API.
# No internal proto dependencies: `buf build` rejects internal type imports,
# keeping internal database shapes out of the public contract.
modules:
  - path: .
    excludes:
      - .direnv
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
  - buf.build/protocolbuffers/wellknowntypes
breaking:
  use:
    - FILE
lint:
  use:
    - COMMENTS
    - STANDARD
  rpc_allow_google_protobuf_empty_requests: true
  rpc_allow_google_protobuf_empty_responses: true
  except:
    - ENUM_VALUE_PREFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
